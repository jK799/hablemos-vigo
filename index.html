<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hablemos · Grupo Vigo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centred working column; azulejo-patterned header band with tabs, then the active view. "Dziś" opens on the daily lesson and the course path. */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --sunk:#E9EEF7; --ink:#13203F; --muted:#59658A; --line:#D7DEEC;
  --cobalt:#1E4DB7; --cobalt-ink:#FFFFFF; --cobalt-soft:#DCE6FB; --saffron:#E3A01B; --saffron-ink:#2A1A00; --tile:rgba(30,77,183,.13);
  --good:#17804F; --good-bg:#E2F4EA; --bad:#BC3535; --bad-bg:#FBE6E6;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#151D32; --sunk:#1B2540; --ink:#E7ECF6; --muted:#9AA6C4; --line:#2A3656;
  --cobalt:#7FA2FF; --cobalt-ink:#0D1322; --cobalt-soft:#1F2C52; --saffron:#F2B94C; --saffron-ink:#2A1A00; --tile:rgba(127,162,255,.10);
  --good:#4BC489; --good-bg:#12321F; --bad:#F07474; --bad-bg:#3A1A1D; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#151D32; --sunk:#1B2540; --ink:#E7ECF6; --muted:#9AA6C4; --line:#2A3656;
  --cobalt:#7FA2FF; --cobalt-ink:#0D1322; --cobalt-soft:#1F2C52; --saffron:#F2B94C; --saffron-ink:#2A1A00; --tile:rgba(127,162,255,.10);
  --good:#4BC489; --good-bg:#12321F; --bad:#F07474; --bad-bg:#3A1A1D; color-scheme:dark }

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.auth{max-width:440px;margin:0 auto;display:grid;gap:16px}
.auth form{display:grid;gap:12px}
.auth label{font-weight:700;font-size:.9rem;color:var(--muted);display:grid;gap:6px}
.auth .field{font-size:1rem}
.err{color:var(--bad);font-weight:700;min-height:1.2em;margin:0}
.rank{list-style:none;margin:0;padding:0;display:grid}
.rank li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rank li:first-child{border-top:none}
.rank li.me{font-weight:700}
.rank .pos{font-family:var(--f-display);font-weight:800;color:var(--muted);text-align:center}
.rank li:nth-child(-n+3) .pos{color:var(--saffron)}
.rank .who{min-width:0;overflow-wrap:anywhere}
.rank .who small{display:block;color:var(--muted);font-weight:400}
.rank .xp{font-variant-numeric:tabular-nums;font-weight:700}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

header{border-bottom:1px solid var(--line);background-color:var(--surface);
  background-image:
    radial-gradient(circle at 50% 50%, transparent 0 9px, var(--tile) 9px 11px, transparent 11px),
    radial-gradient(circle at 0 0, var(--tile) 0 7px, transparent 7px),
    radial-gradient(circle at 100% 100%, var(--tile) 0 7px, transparent 7px),
    radial-gradient(circle at 100% 0, var(--tile) 0 7px, transparent 7px),
    radial-gradient(circle at 0 100%, var(--tile) 0 7px, transparent 7px);
  background-size:36px 36px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:20px 12px}
.brand{display:flex;align-items:baseline;gap:10px;background:var(--surface);padding:2px 10px 4px 0;border-radius:8px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:2rem;letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 .q{color:var(--saffron)}
.brand span{color:var(--muted);font-size:.9rem}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink)}
.goal{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden;margin-bottom:12px}
.goal i{display:block;height:100%;background:var(--saffron);width:0;transition:width .4s}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;padding:10px 14px;border-radius:10px 10px 0 0;background:var(--surface);border:1px solid transparent;border-bottom:none;position:relative;top:1px}
nav a[aria-current="page"]{color:var(--cobalt);border-color:var(--line);background:var(--bg)}

main{padding-block:24px 48px;display:grid;gap:20px}
main > *{min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:4px 0 0}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.notice{background:var(--sunk);border-radius:12px;padding:12px 16px;color:var(--muted);margin:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}

.picker{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.picker label{font-weight:700;color:var(--muted);font-size:.9rem}
.select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 38px 9px 12px;min-width:0;max-width:100%;flex:1 1 260px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.stack{display:grid;gap:16px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
.btn.big{padding:14px 26px;font-size:1.1rem}
.btn.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.btn.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.btn.ghost{background:transparent}
.btn kbd{font-family:inherit;font-size:.72rem;opacity:.7;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:inline-grid;place-items:center;color:var(--cobalt);flex:none}
.speak.sm{width:30px;height:30px}
.speak.xl{width:84px;height:84px;background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
.speak svg{width:20px;height:20px}
.speak.sm svg{width:15px;height:15px}
.speak.xl svg{width:38px;height:38px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{border:none;background:var(--surface);padding:6px 12px;font-size:.88rem;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--sunk);color:var(--ink);font-weight:700}

.scene{perspective:1200px}
.card{position:relative;height:260px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:48px 20px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--sunk)}
.word{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,6vw,2.8rem);line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere;text-wrap:balance}
.word.long{font-size:clamp(1.2rem,4.2vw,1.8rem)}
.face .meta{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.face .hint{position:absolute;bottom:14px;left:16px;right:16px;color:var(--muted);font-size:.85rem}
.level{display:flex;gap:4px}
.level i{width:8px;height:8px;border-radius:2px;background:var(--line);transform:rotate(45deg)}
.level i.on{background:var(--saffron)}

.prompt{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:1.05rem;display:flex;gap:12px;align-items:center;min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--cobalt)}
.opt .n{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}

.field{width:100%;min-width:0;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:1.2rem}
.field:focus{border-color:var(--cobalt);outline:none}
.field.ok{border-color:var(--good);background:var(--good-bg)}
.field.no{border-color:var(--bad);background:var(--bad-bg)}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.accents button{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:1.05rem}
.accents button:hover{border-color:var(--cobalt)}
.reportbox{border-top:1px dashed var(--line);padding-top:12px}
.feedback{min-height:1.5em;font-weight:700;min-width:0;overflow-wrap:anywhere;flex:1 1 200px}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)} .feedback.near{color:var(--saffron)}
.answerline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.conj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:8px 12px;align-items:center}
.conj .pro{color:var(--muted);font-weight:700;text-align:right}
.conj .mark{width:22px;text-align:center;font-weight:700}
.conj .field{font-size:1.05rem;padding:8px 12px}
.verbhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.verbhead .word{font-size:2.2rem}
.tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.irr,.tag.new{background:var(--saffron);color:var(--saffron-ink)}
.tag.ok{background:var(--good-bg);color:var(--good)}
.tag.cur{background:var(--cobalt);color:var(--cobalt-ink)}

/* today */
.hero{background:var(--cobalt);color:var(--cobalt-ink);border-radius:var(--r);padding:26px;display:grid;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:180px;height:180px;opacity:.18;pointer-events:none;
  background-image:radial-gradient(circle at 50% 50%, transparent 0 9px, currentColor 9px 11px, transparent 11px),radial-gradient(circle at 0 0, currentColor 0 7px, transparent 7px),radial-gradient(circle at 100% 100%, currentColor 0 7px, transparent 7px),radial-gradient(circle at 100% 0, currentColor 0 7px, transparent 7px),radial-gradient(circle at 0 100%, currentColor 0 7px, transparent 7px);background-size:36px 36px}
.hero h2{font-size:clamp(1.6rem,5vw,2.2rem)}
.hero .lede{color:inherit;opacity:.85}
.hero .btn{background:var(--saffron);color:var(--saffron-ink);border-color:var(--saffron);justify-self:start}
.counts{display:flex;flex-wrap:wrap;gap:8px 18px}
.counts span{font-variant-numeric:tabular-nums}
.counts b{font-family:var(--f-display);font-size:1.5rem;margin-right:4px}
.goalpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.9rem}

.path{display:grid;gap:0;list-style:none;margin:0;padding:0}
.path li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.path li:first-child{border-top:none}
.path .num{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums;transform:rotate(45deg)}
.path .num span{transform:rotate(-45deg)}
.path li.done .num{background:var(--good);color:var(--surface)}
.path li.cur .num{background:var(--cobalt);color:var(--cobalt-ink)}
.path .t{min-width:0}
.path .t button{background:none;border:none;padding:0;text-align:left;font-weight:700;overflow-wrap:anywhere}
.path .t button:hover{color:var(--cobalt)}
.path .mini{display:flex;gap:6px;margin-top:6px;align-items:center}
.path .mini i{display:block;height:5px;border-radius:999px;background:var(--sunk);flex:1;max-width:120px;overflow:hidden}
.path .mini i b{display:block;height:100%}
.path .mini .v b{background:var(--cobalt)} .path .mini .e b{background:var(--good)}
.path .mini small{color:var(--muted);font-size:.78rem;white-space:nowrap}

/* session */
.sessbar{display:flex;gap:12px;align-items:center}
.sessbar .meter{flex:1}
.meter{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);transition:width .3s}
.kind{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--sunk);color:var(--muted)}
.intro{display:grid;gap:10px;justify-items:center;text-align:center;padding-block:10px}
.listen{display:grid;justify-items:center;gap:8px;padding-block:6px}
.summary{display:grid;gap:18px;text-align:center;justify-items:center}
.summary .word{font-size:clamp(2rem,7vw,3rem)}

/* grammar */
.gcard{display:grid;gap:10px;padding-block:18px;border-top:1px solid var(--line)}
.gcard:first-of-type{border-top:none;padding-top:0}
.gcard p{margin:0;max-width:65ch}
.exl{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.exl li{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:10px;padding:8px 10px;min-width:0}
.exl .es{font-weight:700}
.exl .pl{color:var(--muted)}
.exl div{min-width:0;overflow-wrap:anywhere}
.vtable{width:100%;border-collapse:collapse;font-size:.95rem}
.vtable td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
.vtable td:first-child{font-weight:700}
.vtable td:last-child{width:40px}
.vwrap{overflow-x:auto}
details summary{cursor:pointer;font-weight:700;color:var(--cobalt)}
.exprompt{font-family:var(--f-display);font-size:clamp(1.2rem,4vw,1.6rem);font-weight:700;line-height:1.3;overflow-wrap:anywhere}

/* progress */
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:.92rem}
.bar > span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden;display:flex}
.bar .track i{display:block;height:100%}
.bar .track .m{background:var(--cobalt)} .bar .track .l{background:var(--saffron);opacity:.6}
.bar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.big div{background:var(--sunk);border-radius:12px;padding:14px 16px}
.big b{display:block;font-family:var(--f-display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:.85rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;justify-items:start;opacity:.55}
.bdg.on{opacity:1;border-color:var(--saffron);background:var(--sunk)}
.bdg .ic{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--line);color:var(--muted);transform:rotate(45deg)}
.bdg.on .ic{background:var(--saffron);color:var(--saffron-ink)}
.bdg .ic svg{width:18px;height:18px;transform:rotate(-45deg)}
.bdg b{font-size:.92rem}
.bdg small{color:var(--muted);font-size:.8rem;line-height:1.3}
.empty{color:var(--muted)}

/* sentence tiles, speaking, tutor */
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;align-content:flex-start}
.ansline{border-bottom:2px dashed var(--line);padding-bottom:10px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;font-size:1.05rem;box-shadow:0 2px 0 var(--line)}
.tile:hover{border-color:var(--cobalt)}
.mic{width:84px;height:84px;border-radius:999px;border:none;background:var(--saffron);color:var(--saffron-ink);display:grid;place-items:center}
.mic svg{width:34px;height:34px}
.mic.on{background:var(--bad);color:var(--surface);animation:pulse 1.2s ease-in-out infinite}
.mic.sm{width:46px;height:46px;flex:none}.mic.sm svg{width:20px;height:20px}
@keyframes pulse{50%{transform:scale(1.07)}}
.aibox{background:var(--sunk);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:65ch}
.aibox::before{content:"Korepetytor";display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--cobalt);font-weight:700;margin-bottom:4px}
.scen{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:4px;align-content:start}
.scen button:hover{border-color:var(--cobalt)}
.scen small{color:var(--muted);line-height:1.35}
.chat{display:grid;gap:12px;align-content:start;min-height:240px}
.msg{max-width:88%;padding:12px 14px;border-radius:16px;display:grid;gap:8px;min-width:0;overflow-wrap:anywhere}
.msg.ai{background:var(--sunk);justify-self:start;border-bottom-left-radius:4px}
.msg.me{background:var(--cobalt);color:var(--cobalt-ink);justify-self:end;border-bottom-right-radius:4px}
.msg .pl{color:var(--muted);font-size:.9rem}
.msg .tools{display:flex;gap:8px;align-items:center}
.msg .tools button.link{background:none;border:none;padding:0;color:var(--cobalt);font-size:.85rem;font-weight:700}
.corr{background:var(--surface);color:var(--ink);border:1px solid var(--saffron);border-radius:10px;padding:8px 10px;font-size:.9rem;display:grid;gap:4px}
.corr b{color:var(--good)}
.typing{color:var(--muted);font-style:italic}
.ctawide{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (max-width:520px){
  .bar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 54px}
  .panel{padding:18px}
  .hero{padding:20px}
  .card{height:230px}
  .conj{grid-template-columns:minmax(0,90px) minmax(0,1fr) auto}
  .path li{grid-template-columns:32px minmax(0,1fr)}
  .path li > .tag{grid-column:2}
}
@media (hover: none){ .btn kbd, .opt .n{display:none} }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- built-in extra vocabulary (outside the course files) ---------- */
const EXTRA = [
 {id:'x-jedzenie', name:'Jedzenie', vocab:[['el pan','chleb'],['el agua','woda'],['la leche','mleko'],['el queso','ser'],['la manzana','jabłko'],['el pollo','kurczak'],['el pescado','ryba'],['el arroz','ryż'],['el huevo','jajko'],['la carne','mięso'],['el café','kawa'],['la cerveza','piwo']]},
 {id:'x-rodzina', name:'Rodzina', vocab:[['la madre','matka'],['el padre','ojciec'],['el hermano','brat'],['la hermana','siostra'],['el hijo','syn'],['la hija','córka'],['el abuelo','dziadek'],['la abuela','babcia'],['el marido','mąż'],['la esposa','żona'],['el tío','wujek'],['la tía','ciocia']]},
 {id:'x-dom', name:'Dom i miasto', vocab:[['la cocina','kuchnia'],['el baño','łazienka'],['la puerta','drzwi'],['la ventana','okno'],['la silla','krzesło'],['la cama','łóżko'],['la calle','ulica'],['la tienda','sklep'],['la farmacia','apteka'],['la ciudad','miasto']]},
 {id:'x-podroze', name:'Podróże', vocab:[['el aeropuerto','lotnisko'],['la estación','dworzec'],['el billete','bilet'],['la playa','plaża'],['la maleta','walizka'],['el tren','pociąg'],['el coche','samochód'],['a la izquierda','w lewo'],['a la derecha','w prawo'],['todo recto','prosto'],['¿dónde está?','gdzie jest?']]},
 {id:'x-przymiotniki', name:'Przymiotniki', vocab:[['grande','duży'],['pequeño','mały'],['bueno','dobry'],['malo','zły'],['nuevo','nowy'],['viejo','stary'],['caliente','gorący'],['frío','zimny'],['bonito','ładny'],['fácil','łatwy'],['difícil','trudny'],['caro','drogi']]},
].map(t => ({...t, extra:true, grammar:[], ex:[]}));
const BASE_VERBS = [
 {inf:'hablar', pl:'mówić', irr:false, f:['hablo','hablas','habla','hablamos','habláis','hablan']},
 {inf:'comer',  pl:'jeść',  irr:false, f:['como','comes','come','comemos','coméis','comen']},
 {inf:'vivir',  pl:'mieszkać', irr:false, f:['vivo','vives','vive','vivimos','vivís','viven']},
 {inf:'ser',    pl:'być (cecha)', irr:true, f:['soy','eres','es','somos','sois','son']},
 {inf:'estar',  pl:'być (stan)', irr:true, f:['estoy','estás','está','estamos','estáis','están']},
 {inf:'tener',  pl:'mieć', irr:true, f:['tengo','tienes','tiene','tenemos','tenéis','tienen']},
 {inf:'ir',     pl:'iść / jechać', irr:true, f:['voy','vas','va','vamos','vais','van']},
 {inf:'hacer',  pl:'robić', irr:true, f:['hago','haces','hace','hacemos','hacéis','hacen']},
];
const PRONOUNS = ['yo','tú','él / ella / usted','nosotros','vosotros','ellos / ustedes'];

let TOPICS = [], COURSE = [], VERBS = [], ALL = [], UNIQ = [], courseLoaded = false;
function buildData(course){
  COURSE = course ? course.topics.slice().sort((a,b) => (a.n||0) - (b.n||0)) : [];
  TOPICS = [...COURSE, ...EXTRA];
  const vmap = new Map();
  (course ? course.verbs : []).forEach(v => vmap.set(v.inf, v));
  BASE_VERBS.forEach(v => { if (!vmap.has(v.inf)) vmap.set(v.inf, v); });
  VERBS = [...vmap.values()].sort((a,b) => (a.refl - b.refl) || a.inf.localeCompare(b.inf, 'es'));
  ALL = TOPICS.flatMap(t => t.vocab.map(([es,pl,alt]) => ({es, pl, alt, cat:t.id})));
  const seen = new Set(); UNIQ = ALL.filter(w => !seen.has(w.es) && seen.add(w.es));
}

/* ---------- state ---------- */
const MAXBOX = 6, MASTER = 3, NEW_PER_DAY = 8;
const INTERVAL = [0, 1, 3, 7, 14, 30, 60]; // days until next review, by box
const dayStr = (d = new Date()) => { const z = new Date(d.getTime() - d.getTimezoneOffset()*6e4); return z.toISOString().slice(0,10); };
const today = () => dayStr();
const addDays = n => dayStr(new Date(Date.now() + n*864e5));
let S = {boxes:{}, due:{}, xp:0, streak:0, lastDay:null, dayXp:0, day:null, newToday:0, goal:100,
         cat:'all', dir:'es', exDone:{}, gTopic:null, exTopic:null, verb:'ser', curTopic:null, badges:[], sessions:0, history:{},
         mist:{}, exWrong:{}, exMode:'karty', chats:0, autoSpeak:true};
const S_DEFAULTS = JSON.stringify(S);
let LS_KEY = null;
function fixState(){ for (const k of ['boxes','due','exDone','history','mist','exWrong']) S[k] = S[k] || {}; S.badges = S.badges || []; }
fixState();
function saveLocal(){ if (!LS_KEY) return; try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {} }
function save(){ saveLocal(); scheduleCloud(); }
function rollDay(){ if (S.day !== today()) { S.day = today(); S.dayXp = 0; S.newToday = 0; saveLocal(); } }
rollDay();

/* Progress sync: one private document per signed-in person (data/users/<id>/progress). */
let cloud = null, cloudTimer = null, cloudBusy = false, cloudDirty = false, syncState = 'local';
function scheduleCloud(){ if (!cloud) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(pushCloud, 2500); }
async function pushCloud(){
  if (!cloud) return;
  if (cloudBusy) { cloudDirty = true; return; }
  cloudBusy = true; clearTimeout(cloudTimer); cloudTimer = null;
  try { await cloud.set({state: JSON.stringify(S), savedAt: Date.now()}); syncState = 'cloud'; }
  catch(e) { syncState = 'error'; }
  cloudBusy = false; renderSync();
  if (cloudDirty) { cloudDirty = false; pushCloud(); }
}
// Combine progress from two devices: keep the better knowledge of each word and the union of finished work.
function mergeState(r){
  const L = S, out = {...r, ...L};
  out.boxes = {...(r.boxes||{})}; out.due = {...(r.due||{})};
  for (const es in L.boxes) {
    const rb = (r.boxes||{})[es];
    if (rb === undefined || L.boxes[es] > rb || (L.boxes[es] === rb && (L.due[es]||'') > ((r.due||{})[es]||''))) { out.boxes[es] = L.boxes[es]; out.due[es] = L.due[es]; }
  }
  out.exDone = {...(r.exDone||{}), ...L.exDone};
  out.history = {...(r.history||{})}; for (const d in L.history) out.history[d] = Math.max(out.history[d]||0, L.history[d]);
  out.badges = [...new Set([...(r.badges||[]), ...L.badges])];
  for (const k of ['xp','sessions','listenOk','chats','streak']) out[k] = Math.max(r[k]||0, L[k]||0);
  out.lastDay = [r.lastDay||'', L.lastDay||''].sort().pop() || null;
  if (r.day === L.day) { out.dayXp = Math.max(r.dayXp||0, L.dayXp||0); out.newToday = Math.max(r.newToday||0, L.newToday||0); }
  else if ((r.day||'') > (L.day||'')) { out.day = r.day; out.dayXp = r.dayXp; out.newToday = r.newToday; }
  out.mist = {...(r.mist||{}), ...L.mist}; out.exWrong = {...(r.exWrong||{}), ...L.exWrong};
  if (!Object.keys(L.boxes).length && r.goal) { out.goal = r.goal; out.curTopic = r.curTopic; }
  return out;
}
const useCap = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
async function initCloud(){
  const [db, user] = await Promise.all([useCap('db'), useCap('user')]);
  if (!db || !user) { renderSync(); return; }
  let id = null; try { id = await user.id(); } catch(e) {}
  if (!id) { renderSync(); return; }
  const ref = db.collection('data/users/' + id).doc('progress');
  syncState = 'loading'; renderSync();
  const timer = setTimeout(() => { if (syncState === 'loading') { syncState = 'offline'; renderSync(); } }, 10000);
  try {
    const snap = await ref.get(); clearTimeout(timer);
    cloud = ref;
    let remoteRaw = null;
    if (snap.exists) {
      remoteRaw = (snap.data() || {}).state || '{}';
      let remote = {}; try { remote = JSON.parse(remoteRaw); } catch(e) {}
      Object.assign(S, mergeState(remote)); fixState(); rollDay(); saveLocal();
      if (dataReady) { renderStats(); if (!['lekcja','bledy','rozmowa'].includes(view)) route(); }
    }
    if (JSON.stringify(S) !== remoteRaw) pushCloud(); else { syncState = 'cloud'; renderSync(); }
  } catch(e) { clearTimeout(timer); syncState = 'offline'; renderSync(); }
}
function renderSync(){
  document.querySelectorAll('.syncNote').forEach(n => {
    n.textContent = ({cloud:'Postęp zapisany na Twoim koncie Hablemos, działa na każdym urządzeniu.', loading:'Wczytuję postęp z konta…',
      offline:'Brak połączenia z kontem. Postęp zapisuje się w tej przeglądarce.', error:'Nie udało się zapisać na koncie. Postęp zapisuje się w tej przeglądarce.',
      local:'Postęp zapisuje się tylko w tej przeglądarce.'})[syncState] || '';
  });
}
document.addEventListener('visibilitychange', () => { if (document.hidden && cloudTimer) pushCloud(); });

function addXp(n){
  if (!n) return;
  rollDay();
  S.xp += n; S.dayXp += n;
  S.history[today()] = (S.history[today()] || 0) + n;
  const t = today();
  if (S.lastDay !== t) {
    S.streak = S.lastDay === addDays(-1) ? S.streak + 1 : 1;
    S.lastDay = t;
  }
  save(); renderStats();
}
const box = w => S.boxes[w.es] || 0;
const seenWord = w => w.es in S.boxes;
const isDue = w => seenWord(w) && (S.due[w.es] || '0') <= today();
function grade(w, ok){
  if (!seenWord(w)) { S.newToday++; }
  const b = ok ? Math.min(MAXBOX, box(w) + 1) : Math.max(0, Math.min(box(w), 1) - 1);
  S.boxes[w.es] = b;
  S.due[w.es] = addDays(ok ? INTERVAL[b] : 0);
  save(); renderStats();
}
function introduce(w){ if (!seenWord(w)) { S.boxes[w.es] = 0; S.due[w.es] = today(); S.newToday++; save(); renderStats(); } }

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const topicById = id => TOPICS.find(t => t.id === id);
function pool(){ return (S.cat !== 'all' && topicById(S.cat)) ? ALL.filter(w => w.cat === S.cat) : UNIQ; }
function pickNext(prev){
  const p = pool().filter(w => !prev || w.es !== prev.es);
  if (!p.length) return pool()[0];
  const due = p.filter(isDue);
  if (due.length && Math.random() < .7) return due[Math.floor(Math.random()*due.length)];
  const weighted = p.flatMap(w => Array(MAXBOX + 1 - box(w)).fill(w));
  return weighted[Math.floor(Math.random()*weighted.length)];
}
const cap = {sample:null, tts:null, dict:null};
let capsReady = Promise.resolve(), dataReady = false;
let canSpeak = false; // pronunciation (buttons and read-aloud) removed on request
let ttsNS = null;
const cleanSay = t => String(t).replace(/[¿?¡!]/g,'').replace(/\s*\/\s*/g,', ').replace(/\(.*?\)/g,'').trim();
function browserSpeak(text, slow){
  try {
    if (!('speechSynthesis' in window)) return;
    const s = window.speechSynthesis; s.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.rate = slow ? 0.6 : 0.9;
    const vs = s.getVoices();
    const v = vs.find(v => /^es[-_]ES/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang));
    if (v) u.voice = v;
    s.speak(u);
  } catch(e) {}
}
// Claude's own voice when the viewer has it; the browser's Spanish voice otherwise
function speak(t, slow){
  if (!canSpeak) return;
  const text = cleanSay(t); if (!text) return;
  if (ttsNS) {
    ttsNS.speak(text, {language:'es', rate: slow ? 0.7 : 0.95}).catch(err => {
      const c = err && err.code;
      if (c === 'not_granted' || c === 'unavailable') ttsNS = null;
      if (c && c !== 'stopped' && c !== 'busy' && c !== 'no_gesture') browserSpeak(text, slow);
    });
    return;
  }
  browserSpeak(text, slow);
}
function stopSpeech(){
  try { if (ttsNS) ttsNS.stop().catch(() => {}); } catch(e) {}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e) {}
}
const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const spkBtn = () => '';
const levelDots = w => `<span class="level" title="Poziom ${box(w)} z ${MAXBOX}">${Array.from({length:MAXBOX},(_,i)=>`<i class="${i<box(w)?'on':''}"></i>`).join('')}</span>`;
const catName = id => (topicById(id)||{}).name || 'Wszystkie';
const wordCls = s => s.length > 22 ? 'word long' : 'word';

function norm(s){ return String(s).toLowerCase().replace(/[¿?¡!.,;:"„”«»()]/g,'').replace(/[’']/g,"'").replace(/\s+/g,' ').trim(); }
const noArt = s => s.replace(/^(el|la|los|las|un|una|unos|unas)\s+/,'');
const deacc = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function cmp(a, b){ if (!a) return 'empty'; if (a === b) return 'ok'; if (deacc(a) === deacc(b)) return 'near'; return 'no'; }
function judge(input, target, alt){
  const a = noArt(norm(input));
  // "a (letra A)", "ir / irse": the part in brackets is optional, and each "/" variant counts on its own
  const bare = String(target).replace(/\([^)]*\)/g, ' ');
  const variants = [bare, ...String(target).split(/\s*\/\s*/), ...bare.split(/\s*\/\s*/), ...(Array.isArray(alt) ? alt : [])].map(v => noArt(norm(v))).filter(Boolean);
  let best = a ? 'no' : 'empty';
  for (const v of [noArt(norm(target)), ...variants]) { const r = cmp(a, v); if (r === 'ok') return 'ok'; if (r === 'near') best = 'near'; }
  return best;
}
function judgeEx(input, answer, alt){
  const a = norm(input); if (!a) return 'empty';
  const variants = [answer, ...String(answer).split(/\s+\/\s+|\s*;\s*/), ...(Array.isArray(alt) ? alt : [])].map(norm).filter(Boolean);
  let best = 'no';
  for (const v of variants) { const r = cmp(a, v); if (r === 'ok') return 'ok'; if (r === 'near') best = 'near'; }
  return best;
}

/* topic progress (for path + badges) */
function topicStats(t){
  const ws = ALL.filter(w => w.cat === t.id);
  const vm = ws.filter(w => box(w) >= MASTER).length, vs = ws.filter(seenWord).length;
  const ed = t.ex.filter((_,i) => S.exDone[t.id+'#'+i]).length;
  const vp = ws.length ? vm/ws.length : 1, ep = t.ex.length ? ed/t.ex.length : 1;
  return {ws:ws.length, vm, vs, ed, en:t.ex.length, vp, ep, done: vp >= .8 && ep >= .8};
}
function currentTopic(){
  const t = topicById(S.curTopic);
  if (t && !t.extra) return t;
  return COURSE.find(t => !topicStats(t).done) || COURSE[0] || TOPICS[0];
}

function topicSelect(id, value, filter, allLabel){
  const course = TOPICS.filter(t => !t.extra && filter(t)), extra = TOPICS.filter(t => t.extra && filter(t));
  const opt = t => `<option value="${t.id}" ${t.id===value?'selected':''}>${t.n ? t.n + '. ' : ''}${esc(t.name)}</option>`;
  return `<div class="picker"><label for="${id}">Temat</label><select class="select" id="${id}">
    ${allLabel ? `<option value="all" ${value==='all'?'selected':''}>${allLabel}</option>` : ''}
    ${course.length ? `<optgroup label="Lekcje kursu">${course.map(opt).join('')}</optgroup>` : ''}
    ${extra.length ? `<optgroup label="Dodatkowe słówka">${extra.map(opt).join('')}</optgroup>` : ''}
  </select></div>`;
}
const vocabSelect = () => topicSelect('catSel', S.cat, t => t.vocab.length > 0, `Wszystkie słówka (${UNIQ.length})`);
function bindCat(){ const s = $('#catSel'); if (s) s.onchange = () => { S.cat = s.value; save(); route(); }; }
function dirHTML(){
  return `<div class="toggle" role="group" aria-label="Kierunek">
    <button data-dir="es" aria-pressed="${S.dir==='es'}">ES → PL</button>
    <button data-dir="pl" aria-pressed="${S.dir==='pl'}">PL → ES</button></div>`;
}
const ACC = ['á','é','í','ó','ú','ñ','ü','¿','¡'];
const accentsHTML = () => `<div class="accents" aria-label="Znaki hiszpańskie">${ACC.map(c=>`<button type="button" data-acc="${c}" tabindex="-1">${c}</button>`).join('')}</div>`;

/* ---------- badges ---------- */
const IC = {
  fire:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S9 11 11 11c0-4 1-9 1-9z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21l1.4-7L2 9.3l7-.8z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m5 12 5 5 9-10"/></svg>',
  ear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 0"/></svg>',
};
function badgeList(){
  const mastered = UNIQ.filter(w => box(w) >= MASTER).length;
  const exDone = Object.keys(S.exDone).length;
  const done = COURSE.filter(t => topicStats(t).done);
  const list = [
    ['first','Pierwszy krok','Ukończ pierwszą lekcję dnia', S.sessions >= 1, 'star'],
    ['s5','Rutyna','5 lekcji dnia', S.sessions >= 5, 'star'],
    ['st3','Racha 3','3 dni nauki z rzędu', S.streak >= 3, 'fire'],
    ['st7','Tydzień','7 dni nauki z rzędu', S.streak >= 7, 'fire'],
    ['st30','Miesiąc','30 dni nauki z rzędu', S.streak >= 30, 'fire'],
    ['w50','50 słówek','50 opanowanych słówek', mastered >= 50, 'book'],
    ['w200','200 słówek','200 opanowanych słówek', mastered >= 200, 'book'],
    ['w500','500 słówek','500 opanowanych słówek', mastered >= 500, 'book'],
    ['e100','Pracowity','100 zadań z kart pracy', exDone >= 100, 'check'],
    ['e500','Wszystko zrobione','500 zadań z kart pracy', exDone >= 500, 'check'],
    ['xp1k','1000 XP','Zbierz 1000 XP', S.xp >= 1000, 'star'],
    ['talk','Rozmówca','10 wiadomości w rozmowach z Lucíą', (S.chats||0) >= 10, 'ear'],
    ['talk50','Gaduła','50 wiadomości w rozmowach z Lucíą', (S.chats||0) >= 50, 'ear'],
  ];
  COURSE.forEach(t => list.push(['t-'+t.id, `Lekcja ${t.n}`, t.name, done.includes(t), 'check']));

}
function newBadges(){
  const earned = badgeList().filter(b => b.on && !S.badges.includes(b.id));
  if (earned.length) { S.badges.push(...earned.map(b => b.id)); save(); }
  return earned;
}
const badgeHTML = b => `<div class="bdg ${b.on?'on':''}"><span class="ic">${IC[b.ic]}</span><b>${esc(b.name)}</b><small>${esc(b.desc)}</small></div>`;

/* ---------- one exercise item (shared by the daily lesson and the listening tab) ---------- */
const KIND = {intro:'Nowe słowo', quiz:'Wybierz tłumaczenie', quizpl:'Wybierz po hiszpańsku', type:'Napisz po hiszpańsku', listen:'Słuchanie', ex:'Zadanie z karty pracy', order:'Ułóż zdanie', say:'Powiedz na głos'};
function trackMistake(item, ok){
  if (item.w) { const m = (S.mist[item.w.es]||0) + (ok ? -1 : 1); if (m > 0) S.mist[item.w.es] = m; else delete S.mist[item.w.es]; }

function sentencePool(t){
  const out = [], seen = new Set();
  (t ? [t] : COURSE).forEach(tp => tp.grammar.forEach(g => (g.ex||[]).forEach(([es,pl]) => {
    if (!es || !pl || seen.has(es)) return;
    const n = sentenceTokens(es).length;
    if (n >= 3 && n <= 9 && !/[\/_…()=→+]|\.\.\./.test(es)) { seen.add(es); out.push({es, pl, t: tp.id}); }
  })));
  return out;
}

  const t = currentTopic();

  const budget = Math.max(0, NEW_PER_DAY - S.newToday);
  let fresh = ALL.filter(w => w.cat === t.id && !seenWord(w));
  const seenEs = new Set(); fresh = fresh.filter(w => !seenEs.has(w.es) && seenEs.add(w.es)).slice(0, Math.min(5, budget));
  const items = fresh.map(w => ({k:'intro', w}));
  const practice = [];
  fresh.forEach(w => practice.push({k: Math.random() < .5 ? 'quiz' : 'quizpl', w}));
  const canSay = cap.dict && !S.noDict;
  due.forEach((w, n) => {
    if (canSay && n < 2 && shortWord(w) && box(w) >= 1) return practice.push({k:'say', w});
    const kinds = ['quiz','quizpl','type'];
    practice.push({k: box(w) >= 2 ? kinds[1 + Math.floor(Math.random()*(kinds.length-1))] : kinds[Math.floor(Math.random()*2)], w});
  });
  const exTodo = t.ex.map((e,i) => ({k:'ex', e, i, t:t.id})).filter(x => !S.exDone[x.t+'#'+x.i]);
  practice.push(...exTodo.slice(0, 4));
  shuffle(sentencePool(t)).slice(0, 2).forEach(s => practice.push({k:'order', s, t:t.id}));
  if (practice.length < 8) {
    const extra = shuffle(ALL.filter(w => w.cat === t.id && seenWord(w) && !due.includes(w))).slice(0, 8 - practice.length);
    extra.forEach(w => practice.push({k: 'type', w}));
  }

}
function buildMistakes(){

    </section>
    <p class="lede syncNote" style="margin:0;font-size:.85rem"></p>`;
  renderSync();
  $('#startLesson').onclick = () => { location.hash = 'lekcja'; };
  const io = $('#introOk'); if (io) io.onclick = () => { S.introSeen = true; save(); $('#introCard').remove(); };

  app.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { S.curTopic = b.dataset.topic; save(); route(); window.scrollTo({top:0, behavior:'smooth'}); });
  return e => { if (e.key === 'Enter') $('#startLesson').click(); };
};

function runSession(L, emptyMsg){
  const queue = L.items.slice(); let pos = 0, right = 0, wrong = 0;
  const xp0 = S.xp, mastered0 = UNIQ.filter(w => box(w) >= MASTER).length;
  const retried = new Set();
  if (!queue.length) { app.innerHTML = `<p class="notice">${emptyMsg}</p><div class="row"><a class="btn" href="#dzis">Wróć</a></div>`; return; }
  const step = () => {
    if (pos >= queue.length) return finish();
    const it = queue[pos];
    app.innerHTML = `
      <div class="sessbar"><a class="btn ghost" href="#dzis" aria-label="Zakończ lekcję">✕</a>
        <div class="meter"><i style="width:${pos/queue.length*100}%"></i></div><span class="label">${pos+1}/${queue.length}</span></div>
      <section class="panel stack" id="slot"></section>`;
    runItem($('#slot'), it, ok => {
      if (it.k !== 'intro') {
        if (ok) right++;
        else {
          wrong++;
          const key = it.w ? it.w.es : it.s ? it.s.es : it.t + '#' + it.i;
          if (!retried.has(key)) { retried.add(key); queue.push({...it, k: it.w ? (['listen','say'].includes(it.k) ? 'type' : it.k) : it.k, result: undefined, cleanup: null}); }
        }
      }
      pos++; step();
    });
  };
  const finish = () => {
    S.sessions = (S.sessions||0) + 1; save();
    const earned = newBadges();
    const gained = S.xp - xp0, mastered = UNIQ.filter(w => box(w) >= MASTER).length - mastered0;
    const pct = right + wrong ? Math.round(right / (right + wrong) * 100) : 100;
    app.innerHTML = `
      <section class="panel summary">
        <span class="label">Sesja ukończona</span>
        <div class="word">${pct >= 90 ? '¡Excelente!' : pct >= 70 ? '¡Muy bien!' : '¡Ánimo!'}</div>
        <div class="big" style="width:100%">
          <div><b>+${gained}</b><span>XP</span></div>
          <div><b>${pct}%</b><span>poprawnych odpowiedzi</span></div>
          <div><b>${mastered >= 0 ? '+' + mastered : mastered}</b><span>opanowanych słówek</span></div>
          <div><b>${S.streak}</b><span>dni z rzędu</span></div>
        </div>
        ${earned.length ? `<div style="width:100%;display:grid;gap:10px"><span class="label">Nowe odznaki</span><div class="badges">${earned.map(badgeHTML).join('')}</div></div>` : ''}
        <div class="row" style="justify-content:center"><button class="btn primary" id="again">Jeszcze jedna sesja</button><a class="btn" href="#dzis">Wróć do planu</a>${cap.sample ? '<a class="btn" href="#rozmowa">Porozmawiaj z Lucíą</a>' : ''}</div>
      </section>`;
    $('#again').onclick = () => route();
  };
  step();
  return e => { if (itemKeys) itemKeys(e); };
}

async function aiTurn(){
  const c = chat; c.busy = true; c.error = ''; c.hints = []; renderChat();
  const t = topicById(c.scen.topic);
  const vocab = t ? shuffle(t.vocab).slice(0, 40).map(v => v[0]).join(', ') : '';
  const transcript = c.msgs.slice(-16).map(m => (m.who === 'ai' ? 'Lucía: ' : 'Uczeń: ') + m.text).join('\n');
  const lastMe = [...c.msgs].reverse().find(m => m.who === 'me');
  const prompt = `Jesteś Lucía, przyjazna Hiszpanka z Vigo, i prowadzisz rozmowę ćwiczeniową z Polakiem, który uczy się hiszpańskiego od zera (poziom A1).
Scenariusz: ${c.scen.desc}
${vocab ? 'Słownictwo z kursu, którego warto używać: ' + vocab + '\n' : ''}Zasady:
- Odpowiadaj po hiszpańsku (Hiszpania, forma "tú"), bardzo prosto: 1–2 krótkie zdania w czasie teraźniejszym, słownictwo A1.
- Zawsze zakończ jednym prostym pytaniem, żeby rozmowa toczyła się dalej, i trzymaj się scenariusza.
- Jeśli uczeń napisze po polsku albo czegoś nie rozumie, pomóż mu prostym hiszpańskim.
- Oceń ostatnią wypowiedź ucznia. Ignoruj brak wielkich liter, brak ¿¡ i brakujące akcenty w zwykłym czacie, ale popraw błędy gramatyczne, złe słowa i złą odmianę.

Rozmowa do tej pory:
${transcript || '(rozmowa dopiero się zaczyna: przywitaj się krótko i zadaj pierwsze pytanie)'}

Odpowiedz WYŁĄCZNIE obiektem JSON o polach:
"reply": Twoja odpowiedź po hiszpańsku,
"pl": tłumaczenie "reply" na polski,
"better": poprawiona wersja ostatniej wypowiedzi ucznia po hiszpańsku albo "" gdy była poprawna (albo gdy jeszcze nic nie napisał),
"correction": krótkie wyjaśnienie błędu po polsku (1 zdanie) albo "",
"hints": tablica 3 krótkich, różnych propozycji po hiszpańsku, co uczeń może odpowiedzieć na Twoje pytanie.`;
  try {
    const r = await cap.sample.json(prompt, {modelTier:'default', cache:false});
    if (chat !== c) return;
    if (!r || typeof r.reply !== 'string' || !r.reply.trim()) throw {code:'bad_answer'};
    if (lastMe) { lastMe.better = typeof r.better === 'string' && norm(r.better) !== norm(lastMe.text) ? r.better.trim() : ''; lastMe.corr = lastMe.better && typeof r.correction === 'string' ? r.correction.trim() : ''; }
    c.msgs.push({who:'ai', text: r.reply.trim(), pl: typeof r.pl === 'string' ? r.pl.trim() : ''});
    c.hints = Array.isArray(r.hints) ? r.hints.filter(h => typeof h === 'string' && h.trim()).slice(0, 3).map(h => h.trim()) : [];
    if (S.autoSpeak && canSpeak) speak(r.reply);
  } catch(err) {
    if (chat !== c) return;
    c.error = err && err.code === 'rate_limited' ? 'Lucía jest teraz zajęta. Spróbuj za chwilę.' : err && err.code === 'not_granted' ? 'Nie ma zgody na korepetytora AI na tej stronie.' : 'Nie udało się dostać odpowiedzi. Spróbuj wysłać wiadomość jeszcze raz.';
  }
  c.busy = false;
  if (view === 'rozmowa' && chat === c) { renderChat(); const i = $('#chatIn'); if (i) i.focus(); }
}

V.cwiczenia = () => {
  const withEx = TOPICS.filter(t => t.ex.length || sentencePool(t).length);
  if (!withEx.length) { app.innerHTML = `<div><h2>Ćwiczenia</h2></div><p class="notice">Ćwiczenia z kursu nie zostały wczytane.</p>`; return; }
  if (!topicById(S.exTopic) || !withEx.includes(topicById(S.exTopic))) S.exTopic = withEx.includes(currentTopic()) ? currentTopic().id : withEx[0].id;
  const t = topicById(S.exTopic);
  const mode = S.exMode === 'zdania' ? 'zdania' : 'karty';
  const sentences = sentencePool(t);
  const keyOf = i => t.id + '#' + i;
  let order = [], pos = 0;
  const doneCount = () => t.ex.filter((_,i) => S.exDone[keyOf(i)]).length;
  const start = onlyTodo => {
    if (mode === 'zdania') { order = shuffle(sentences.map((_,i)=>i)); pos = 0; return draw(); }
    order = t.ex.map((_,i)=>i);
    if (onlyTodo) { const todo = order.filter(i => !S.exDone[keyOf(i)]); if (todo.length) order = todo; }
    pos = 0; draw();
  };
  const draw = () => {
    const dc = doneCount();
    app.innerHTML = `
      <div><h2>Ćwiczenia</h2><p class="lede">Zadania z kart pracy z kursu albo układanie zdań z przykładów z lekcji.</p></div>

      ${topicSelect('exSel', t.id, x => withEx.includes(x))}
      ${mode === 'karty' ? `<div style="display:grid;gap:6px">
        <div class="row spread"><span class="label">${esc(t.source || t.name)}</span><span class="stat">Zrobione <b>${dc}</b>/<b>${t.ex.length}</b></span></div>
        <div class="meter"><i style="width:${t.ex.length ? dc/t.ex.length*100 : 0}%"></i></div></div>` : `<div class="row spread"><span class="label">${sentences.length} zdań w temacie</span><span class="label">${Math.min(pos+1, order.length)} z ${order.length}</span></div>`}
      <section class="panel stack" id="slot"></section>
      ${mode === 'karty' ? `<div class="row"><button class="btn ghost" id="todo" type="button">Tylko niezrobione</button><button class="btn ghost" id="restart" type="button">Wszystkie od początku</button><span class="label">${Math.min(pos+1, order.length)} z ${order.length}</span></div>` : ''}`;
    $('#exSel').onchange = ev => { S.exTopic = ev.target.value; save(); route(); };
    app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { S.exMode = b.dataset.mode; save(); route(); });
    const todo = $('#todo'); if (todo) todo.onclick = () => start(true);
    const rs = $('#restart'); if (rs) rs.onclick = () => start(false);
    if (!order.length) { $('#slot').innerHTML = `<p class="empty" style="margin:0">${mode === 'zdania' ? 'Ten temat nie ma przykładowych zdań. Wybierz inny temat albo karty pracy.' : 'Ten temat nie ma zadań z kart pracy. Wybierz inny temat albo układanie zdań.'}</p>`; return; }
    if (pos >= order.length) {
      $('#slot').innerHTML = `<h3>Koniec zestawu</h3><p class="lede">${mode === 'karty' ? `Masz ${dc} z ${t.ex.length} zadań zrobionych w temacie „${esc(t.name)}”.` : 'Wszystkie zdania z tego tematu przećwiczone.'}</p><div class="row"><button class="btn primary" id="again">${mode === 'karty' ? 'Powtórz niezrobione' : 'Jeszcze raz'}</button></div>`;
      $('#again').onclick = () => start(true); return;

  };
  start(true);
  return e => { if (itemKeys) itemKeys(e); };
};

function isoWeek(d = new Date()){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));

// Login is the username alone: the password is derived from username + group code, and the code is remembered on the device.
async function derivePw(uname, code){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(uname + '|' + code.trim().toUpperCase() + '|hablemos-v1'));
  return 'h1-' + [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 40);
}

        } catch(e) {
          $('#newAcc').hidden = true;
          err.textContent = e && e.message && !e.code && !e.status ? e.message : errText(e);
        }
      };
    } catch(e) { err.textContent = errText(e); busy(false); }
  };
}
function showCode(msg = ''){
  hideChrome(true);
  app.innerHTML = `<section class="auth"><div><h2>Kod grupy</h2><p class="lede">Wpisz kod grupy od prowadzącego, żeby zobaczyć materiały kursu.</p></div>
    <form class="panel" id="codeF"><label>Kod grupy<input class="field" id="cCode" autocomplete="off" autocapitalize="characters" placeholder="VIGO-…"></label>
    <p class="err" id="cErr" role="alert"></p><button class="btn primary big">Dołącz</button></form>
    <button class="btn ghost" id="cOut" type="button">Wyloguj</button></section>`;
  $('#cErr').textContent = msg;
  $('#cOut').onclick = logout;
  $('#codeF').onsubmit = async ev => {
    ev.preventDefault();
    const { data: ok, error } = await sb.rpc('join_group', {code: $('#cCode').value.trim()});
    if (error) { $('#cErr').textContent = errText(error); return; }
    if (!ok) { $('#cErr').textContent = 'Ten kod jest niepoprawny.'; return; }
    afterLogin((await sb.auth.getUser()).data.user);
  };
}
async function logout(){ try { await pushCloud(); } catch(e) {} await sb.auth.signOut(); location.hash = ''; location.reload(); }

async function afterLogin(user){
  me = user;
  app.innerHTML = '<p class="notice">Wczytuję materiały kursu…</p>';
  const { data: member } = await sb.rpc('is_member');
  if (!member) return showCode();
  // this person's own local copy (a shared computer keeps people apart)
  LS_KEY = 'hablemos:' + user.id;
  for (const k of Object.keys(S)) delete S[k];
  Object.assign(S, JSON.parse(S_DEFAULTS));
  try { Object.assign(S, JSON.parse(localStorage.getItem(LS_KEY) || '{}')); } catch(e) {}
  fixState(); rollDay();
  const [{ data: courseRow, error: ce }, { data: prog }] = await Promise.all([
    sb.from('course').select('data').eq('id', 1).maybeSingle(),
    sb.from('progress').select('state').eq('user_id', user.id).maybeSingle(),
  ]);
  if (ce || !courseRow) { app.innerHTML = `<p class="notice">Nie udało się wczytać materiałów kursu. Odśwież stronę za chwilę.</p>`; return; }
  courseLoaded = true;
  buildData(courseRow.data);
  if (prog && prog.state) { Object.assign(S, mergeState(prog.state)); fixState(); rollDay(); }
  for (const es in S.boxes) if (!S.due[es]) S.due[es] = today();
  cloud = {
    async set({state}){
      const now = new Date().toISOString();
      const { error } = await sb.from('progress').upsert({user_id: me.id, state: JSON.parse(state), updated_at: now});
      if (error) throw error;
      if (S.nick) {
        const r = await sb.from('ranking').upsert({user_id: me.id, nick: S.nick, visible: S.rankVisible !== false, week: isoWeek(),
          week_xp: weekXp(), streak: S.streak, mastered: UNIQ.filter(w => box(w) >= MASTER).length, updated_at: now});
        if (r.error) throw r.error;
      }
    }
  };
  reportIssue = async p => { const { error } = await sb.from('reports').insert({...p, user_id: me.id}); if (error) throw error; };
  syncState = 'cloud';
  saveLocal(); dataReady = true; hideChrome(false); renderStats(); route();
  pushCloud();
}

V.grupa = () => {
  app.innerHTML = `
    <div><h2>Grupa Vigo</h2><p class="lede">Ranking tego tygodnia (XP od poniedziałku). Widać w nim tylko pseudonim, XP, serię dni i liczbę opanowanych słówek. Reszta postępu jest prywatna.</p></div>
    <section class="panel stack">
      <h3>Twój pseudonim</h3>
      <form id="nickF" class="answerline" autocomplete="off">
        <input class="field" id="nickIn" maxlength="24" placeholder="np. Kuba (inny niż nazwa użytkownika)" aria-label="Pseudonim" style="flex:1 1 200px;font-size:1rem">
        <button class="btn primary">Zapisz</button></form>
      <label class="row" style="gap:8px;color:var(--muted)"><input type="checkbox" id="rankVis"> Pokazuj mnie w rankingu grupy</label>
      <p class="err" id="nickErr" role="alert"></p>
    </section>
    <section class="panel stack"><div class="row spread"><h3>Ranking tygodnia</h3><span class="label">${isoWeek()}</span></div><div id="rankList"><p class="lede">Wczytuję…</p></div></section>
    <div class="row spread"><span class="lede" id="whoami" style="font-size:.9rem"></span><button class="btn ghost" id="logout" type="button">Wyloguj</button></div>`;
  $('#nickIn').value = S.nick || '';
  $('#rankVis').checked = S.rankVisible !== false;
  $('#whoami').textContent = me ? 'Zalogowano jako ' + userName(me) : '';
  $('#logout').onclick = logout;
  const loadRank = async () => {
    const { data, error } = await sb.from('ranking').select('user_id,nick,week_xp,streak,mastered').eq('week', isoWeek()).order('week_xp', {ascending:false}).limit(100);
    const box_ = $('#rankList'); if (!box_) return;
    if (error) { box_.innerHTML = '<p class="err">Nie udało się wczytać rankingu.</p>'; return; }
    if (!data.length) { box_.innerHTML = '<p class="lede">W tym tygodniu nikt jeszcze nie ćwiczył. Bądź pierwszy!</p>'; return; }
    const ol = document.createElement('ol'); ol.className = 'rank';
    data.forEach((r, i) => {
      const li = document.createElement('li'); if (me && r.user_id === me.id) li.className = 'me';
      const pos = document.createElement('span'); pos.className = 'pos'; pos.textContent = i + 1;
      const who = document.createElement('span'); who.className = 'who'; who.textContent = r.nick + (me && r.user_id === me.id ? ' (Ty)' : '');
      const sm = document.createElement('small'); sm.textContent = `seria ${r.streak} dni · ${r.mastered} słówek`; who.appendChild(sm);
      const xp = document.createElement('span'); xp.className = 'xp'; xp.textContent = r.week_xp + ' XP';
      li.append(pos, who, xp); ol.appendChild(li);
    });
    box_.textContent = ''; box_.appendChild(ol);
  };
  $('#nickF').onsubmit = async ev => {
    ev.preventDefault();
    const n = $('#nickIn').value.trim();
    if (n.length < 2) { $('#nickErr').textContent = 'Pseudonim musi mieć co najmniej 2 znaki.'; return; }
    S.nick = n; S.rankVisible = $('#rankVis').checked; save();
    $('#nickErr').textContent = '';
    await pushCloud(); loadRank();
  };
  $('#rankVis').onchange = async () => { S.rankVisible = $('#rankVis').checked; save(); if (S.nick) { await pushCloud(); loadRank(); } };
  loadRank();
};

(async () => {
  if (!window.supabase) { app.innerHTML = '<p class="notice">Nie udało się wczytać strony. Sprawdź internet i odśwież.</p>'; return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, {auth: {persistSession: true, autoRefreshToken: true, storageKey: 'hablemos-auth'}});
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showAuth();
  // a stored session can outlive its account (deleted or reset): confirm it with the server first
  const { data: fresh, error: ue } = await sb.auth.getUser();
  if (ue || !fresh || !fresh.user) { await sb.auth.signOut().catch(() => {}); return showAuth('Zaloguj się ponownie.'); }
  afterLogin(fresh.user).catch(() => showAuth('Sesja wygasła. Zaloguj się ponownie.'));
})();
</script>
